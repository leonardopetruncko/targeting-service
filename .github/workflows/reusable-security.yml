name: DevSecOps Security Workflow

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Versão do Python para análise SAST'
        required: false
        type: string
        default: '3.11'
      trivy-severity:
        description: 'Níveis de severidade do Trivy para falhar o build'
        required: false
        type: string
        default: 'CRITICAL,HIGH'

jobs:
  sast-bandit:
    name: SAST - Bandit (Python Security)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit SAST Scan
        run: |
          # -r: recursivo
          # -ll: reporta problemas de severidade Média e Alta
          # -x: ignora diretórios de teste e ambientes virtuais
          bandit -r . -ll -x ./tests,./venv,./.venv

  sca-trivy:
    name: SCA - Trivy FS (Dependency & FS Scan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner (FS Mode)
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: ${{ inputs.trivy-severity }}
